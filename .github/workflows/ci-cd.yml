name: Continuous CI/CD

on:
  push:
    branches: [ "develop", "feature/*" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install

      - name: Build the application
        run: yarn build

      - name: Build Docker Image
        run: docker build --build-arg dist=dist -t dockerhub.gtidev.net/kubetools/chartui .

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: dockerhub.gtidev.net
          username: ${{ secrets.NEXUS_USERNAME }}
          password: ${{ secrets.NEXUS_PASSWORD }}

      - name: Push Docker Image
        run: docker push dockerhub.gtidev.net/kubetools/chartui:latest
